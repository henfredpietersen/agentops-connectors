name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  e2e-with-core:
    runs-on: ubuntu-latest
    env:
      AGENTOPS_STANDIN: "1"
      PYTHONPATH: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: henfredpietersen/agentops-loop, path: core}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r core/requirements.txt
      - run: python -m pytest -q tests/test_e2e_core.py -rs
